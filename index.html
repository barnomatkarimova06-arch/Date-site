<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Приглашение 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at 50% 20%, #d8c8ff 0%, transparent 35%),
        linear-gradient(180deg, #faf7ff 0%, #eee7ff 100%);
      color: #4b2e63;
    }

    .screen {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .screen.active {
      display: flex;
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .video-box {
      width: 100%;
      height: 230px;
      border-radius: 28px;
      background: #eadede;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 15px 40px rgba(90, 50, 130, 0.12);
      color: #8c6f85;
      font-family: Arial, sans-serif;
      font-size: 18px;
      overflow: hidden;
    }
.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
    h1 {
      font-size: 30px;
      font-weight: normal;
      line-height: 1.35;
      margin-bottom: 28px;
    }

    p {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: #6f5b79;
    }

    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 16px 24px;
      font-size: 18px;
      cursor: pointer;
    }

    .yes {
      background: linear-gradient(135deg, #8b5cf6, #6d4ce8);
      color: white;
      font-weight: bold;
      width: 48%;
    }

    .no {
      background: white;
      color: #4b2e63;
      width: 48%;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .options {
      margin-top: 25px;
      display: grid;
      gap: 18px;
    }

    .option-card {
      background: rgba(255,255,255,0.85);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(80, 50, 120, 0.10);
      text-align: left;
      font-family: Arial, sans-serif;
      font-size: 18px;
      cursor: pointer;
    }

    .option-card:hover {
      transform: translateY(-2px);
    }

    .back {
      margin-top: 25px;
      background: white;
      color: #5f3fa5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .option-card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 18px;
  display: block;
}

.option-title {
  font-family: Georgia, serif;
  font-size: 18px;
  color: #4b2e63;
  padding: 10px 6px 6px;
  text-align: left;
}

.surprise {
  height: 120px;
  border-radius: 18px;
  background:
    radial-gradient(circle, #d8c8ff 0%, #eee7ff 60%, #faf7ff 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}
  </style>
</head>

<body>

  <section id="screen1" class="screen active">
    <div class="card">

      <div class="video-box">
  <video autoplay muted loop playsinline>
  <source src="./main.MP4" type="video/mp4">
</video>
</div>

      <h1>
        Сократим шаги навстречу друг другу?
      </h1>

      <div class="buttons">
        <button class="yes" onclick="showScreen2()">
          Уже 🏃🏻‍➡️
        </button>

        <button class="no" id="noButton">
          Занят 🏃🏻
        </button>
      </div>

    </div>
  </section>

  <section id="screen2" class="screen">
    <div class="card">

      <p>✨ Личное приглашение</p>

      <h1>
        Я подготовила для нас несколько идей, как можно провести время вместе✨
      </h1>

      <p>
        Теперь выбор за тобой: выбирай понравившийся вариант, дату и время — всё в твоих руках☺️ 
      </p>

      <div class="options">

  <div class="option-card">
    <img src="Piknik .JPG" alt="Творческий пикник">
    <div class="option-title">
      🎨 Творческий пикник
    </div>
  </div>

  <div class="option-card">
    <img src="Katok .JPG" alt="Каток">
    <div class="option-title">
      ⛸ Каток
    </div>
  </div>

  <div class="option-card">
    <img src="Carting.JPG" alt="Картинг">
    <div class="option-title">
      🏁 Картинг
    </div>
  </div>

  <div class="option-card">
    <img src="Lepka .JPG" alt="Гончарный вечер">
    <div class="option-title">
      🌸 Гончарный вечер
    </div>
  </div>

  <div class="option-card">
    <div class="surprise">✨</div>
    <div class="option-title">
      ✨Выбери за меня
    </div>
  </div>

</div>

      </div>

      <button class="back" onclick="showScreen1()">
        Назад
      </button>

    </div>
  </section>

  <script>
    function showScreen2() {
      document.getElementById("screen1").classList.remove("active");
      document.getElementById("screen2").classList.add("active");
    }

    function showScreen1() {
      document.getElementById("screen2").classList.remove("active");
      document.getElementById("screen1").classList.add("active");
    }
    const noButton = document.getElementById("noButton");

let noCount = 0;

const phrases = [
  "Точно занят? 😏",
  "Не верю 😌",
  "Ещё попытка 😂",
  "Ты серьёзно? 👀",
  "Ну всё 😌"
];

function moveNoButton() {

  noCount++;

  if (noCount >= 6) {
    noButton.textContent = "Выбора больше нет 😌💜";

    noButton.style.position = "static";
    noButton.style.width = "100%";
    noButton.style.marginTop = "14px";

    noButton.disabled = true;

    return;
  }

  if (noCount <= phrases.length) {
    noButton.textContent = phrases[noCount - 1];
  }

  const maxX =
    window.innerWidth -
    noButton.offsetWidth -
    20;

  const maxY =
    window.innerHeight -
    noButton.offsetHeight -
    20;

  const x =
    Math.max(10, Math.random() * maxX);

  const y =
    Math.max(10, Math.random() * maxY);

  noButton.style.position = "fixed";
  noButton.style.left = x + "px";
  noButton.style.top = y + "px";
  noButton.style.zIndex = "999";
}

noButton.addEventListener(
  "touchstart",
  function(event) {
    event.preventDefault();
    moveNoButton();
  },
  { passive: false }
);

noButton.addEventListener(
  "mouseenter",
  moveNoButton
);
  </script>

</body>
</html>
